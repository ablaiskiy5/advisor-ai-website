const PORT_START='[ADVISOR_AI_PORTFOLIO_BEGIN]',PORT_END='[ADVISOR_AI_PORTFOLIO_END]';
function parseHoldings(text){
 const lines=String(text||'').trim().split(/\r?\n/).filter(Boolean);if(!lines.length)throw Error('Вставь список позиций.');
 if(lines.length>151)throw Error('Максимум 150 строк за один раз.');
 const rows=[];let seen=new Set();
 for(let k=0;k<lines.length;k++){
  const v=lines[k].split(/[;\t]/).map(x=>x.trim());if(k===0&&/тикер|ticker|symbol/i.test(v[0]))continue;
  const isBond=/^BOND:/i.test(v[0]);const symbol=isBond?v[0].slice(5):v[0];
  if(v.length!==(isBond?4:3))throw Error('Строка '+(k+1)+': для акции три колонки, для BOND: четыре (с дюрацией).');
  const [ticker,qtyText,priceText,durationText]=v;
  if(!/^[A-Za-z0-9.^_-]{1,24}$/.test(symbol))throw Error('Строка '+(k+1)+': неверное обозначение позиции.');
  const duration=isBond?(durationText.trim()===''?NaN:Number(durationText.replace(',','.'))):null;
  if(isBond&&(!Number.isFinite(duration)||duration<0||duration>100))throw Error('Строка '+(k+1)+': дюрация облигации должна быть 0–100 лет.');
  const qty=Number(qtyText.replace(',','.')),price=Number(priceText.replace(',','.'));
  if(!Number.isFinite(qty)||qty<=0||!Number.isFinite(price)||price<0)throw Error('Строка '+(k+1)+': количество должно быть больше нуля, цена не может быть отрицательной.');
  if(seen.has(ticker.toUpperCase()))throw Error('Повторяющийся тикер '+ticker+'. Объедини позиции.');
  seen.add(ticker.toUpperCase());
  const value=qty*price;if(!Number.isFinite(value)||value>1e12)throw Error('Строка '+(k+1)+': слишком большое значение.');
  rows.push({ticker:ticker.toUpperCase(),qty,price,value,isBond,duration});
 }
 if(!rows.length)throw Error('Нет позиций для расчёта.');
 const total=rows.reduce((acc,r)=>acc+r.value,0);if(!total)throw Error('Общая стоимость равна нулю.');
 rows.sort((a,b)=>b.value-a.value);
 const weights=rows.map(r=>r.value/total),hhi=weights.reduce((acc,w)=>acc+w*w,0);
 const bondRows=rows.filter(r=>r.isBond),bondValue=bondRows.reduce((a,r)=>a+r.value,0),equityValue=total-bondValue;
 const bondDuration=bondValue?bondRows.reduce((a,r)=>a+r.value*r.duration,0)/bondValue:0;
 const rateShock100bp=-bondValue*bondDuration*0.01/total;
 return {rows,total,top1:weights[0],top3:weights.slice(0,3).reduce((a,w)=>a+w,0),top5:weights.slice(0,5).reduce((a,w)=>a+w,0),hhi,effectiveCount:1/hhi,largestShock:-.2*rows[0].value/total,bondValue,equityValue,bondDuration,rateShock100bp};
}

function savedPortfolioAmount(notes,label){

 if(!line)return '';

function splitCsvLine(line,delimiter){
 const result=[];let field='',quoted=false;
 for(let i=0;i<line.length;i++){const c=line[i];
  if(c==='"'){if(quoted&&line[i+1]==='"'){field+='"';i++}else quoted=!quoted}
  else if(c===delimiter&&!quoted){result.push(field.trim());field=''}
  else field+=c;
 }
 if(quoted)throw Error('Незакрытая кавычка в CSV.');
 result.push(field.trim());return result;
}
function normalizeHoldingsFile(text){
 const raw=String(text||'').replace(/^\uFEFF/,'').trim();
 if(!raw)throw Error('Файл пустой.');
 const lines=raw.split(/\r?\n/).filter(x=>x.trim().length);
 if(lines.length>151)throw Error('Максимум 150 позиций.');
 const first=lines[0];const delimiter=first.includes('\t')?'\t':first.includes(';')?';':',';
 const decoded=lines.map(line=>splitCsvLine(line,delimiter));
 const norm=x=>String(x||'').toLowerCase().replace(/[\s_-]+/g,'');
 const key=decoded[0].map(norm);
 const lookup=(aliases)=>key.findIndex(k=>aliases.includes(k));
 const ti=lookup(['тикер','ticker','symbol','asset','instrument','инструмент','код']);
 const qi=lookup(['quantity','qty','количество','shares','units','шт']);
 const pi=lookup(['price','unitprice','цена','ценаusd','ценаединицы']);
 const di=lookup(['duration','modifiedduration','modduration','дюрация']);
 const typei=lookup(['type','тип','assettype','класс','вид']);
 const hasHeader=ti>=0&&qi>=0&&pi>=0;
 const start=hasHeader?1:0;
 if(hasHeader&&decoded[0].length>20)throw Error('Слишком много столбцов в CSV.');
 const out=[];
 for(let i=start;i<decoded.length;i++){
  const cells=decoded[i];
  let symbol,quantity,price,duration,isBond;
  if(hasHeader){
   symbol=cells[ti]||'';quantity=cells[qi]||'';price=cells[pi]||'';
   duration=di>=0?cells[di]||'':'';
   isBond=/^bond:|^облигац|^bond$|^fixed.?income$|^fi$/i.test((typei>=0?cells[typei]:'')||symbol);
   if(isBond&&!/^BOND:/i.test(symbol))symbol='BOND:'+symbol;
  }else{
   symbol=cells[0]||'';quantity=cells[1]||'';price=cells[2]||'';duration=cells[3]||'';
   isBond=/^BOND:/i.test(symbol);
   if(cells.length!==(isBond?4:3))throw Error('Строка '+(i+1)+': ожидается '+(isBond?4:3)+' столбца.');
  }
  const line=[symbol,quantity,price,...(isBond?[duration]:[])].join('; ');
  out.push(line);
 }
 if(!out.length)throw Error('В файле не найдено позиций.');
 const result=out.join('\n');
 parseHoldings(result);
 return result;
}
function downloadHoldingsTemplate(){

 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='advisor-ai-portfolio-template.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500);
}
async function importHoldingsFile(file){

 const revision=authRevision,ownerId=session.user.id,caseId=active;

 try{
  const text=await file.text();

 }catch(e){if(importIsCurrent()&&preview)preview.textContent='Ошибка импорта: '+e.message}

}
function calculatePortfolio(){const el=document.getElementById('portfolio-preview');if(!el)return null;try{const data=parseHoldings(document.getElementById('holdings-input').value);const goal=document.getElementById('target-bonds')?.value.trim()||'';if(goal!==''){const target=Number(goal);if(!Number.isFinite(target)||target<0||target>100)throw Error('Целевая доля облигаций должна быть в пределах 0–100%.');data.targetBondPct=target;data.bondTradeValue=data.total*target/100-data.bondValue;}for(const [id,key] of [['cash-usd','cashUsd'],['debt-usd','debtUsd']]){const raw=document.getElementById(id)?.value.trim()||'';if(raw!==''){const amount=Number(raw);if(!Number.isFinite(amount)||amount<0||!/^\d+(?:\.\d{1,2})?$/.test(raw))throw Error('Суммы USD должны быть неотрицательными, максимум 2 знака после запятой.');data[key]=amount;}}const kztRaw=document.getElementById('cash-kzt')?.value.trim()||'',fxRaw=document.getElementById('fx-kzt')?.value.trim()||'';if(kztRaw!==''||fxRaw!==''){const kzt=Number(kztRaw),fx=Number(fxRaw);if(kztRaw===''||fxRaw===''||!/^\d+(?:\.\d{1,2})?$/.test(kztRaw)||!/^\d+(?:\.\d+)?$/.test(fxRaw)||!Number.isFinite(kzt)||!Number.isFinite(fx)||fx<=0)throw Error('Для средств KZT укажи неотрицательную сумму и положительный курс KZT за 1 USD.');data.cashKzt=kzt;data.fxKzt=fx;}el.textContent=summarizeHoldings(data)+(data.targetBondPct===undefined?'':'\n\nЦель: облигации '+data.targetBondPct.toFixed(1)+'%. '+(data.bondTradeValue>=0?'Увеличить облигационную часть на ':'Сократить облигационную часть на ')+Math.abs(data.bondTradeValue).toFixed(2)+' USD, акции изменить на обратную сумму. Без издержек и изменения стоимости портфеля.');return data}catch(e){el.textContent='Ошибка: '+e.message;return null}}
async function savePortfolio(){const data=calculatePortfolio();if(!data)return;const e=entries.find(x=>x.id===active);if(!e||e.kind!=='portfolio')return;

const snapshotsCache=new Map();
function snapshotProfile(row){
 const d=parseHoldings(row.holdings),target=row.target_bond_pct===null||row.target_bond_pct===undefined?null:Number(row.target_bond_pct);
 return {data:d,target,date:row.created_at,title:row.title||'',id:row.id};
}
function snapshotDiff(a,b){
 const d1=a.data,d2=b.data,percent=n=>(100*n).toFixed(2)+'%',money=n=>n.toLocaleString('en-US',{maximumFractionDigits:2});
 const metrics=[['Общая стоимость USD',money(d1.total),money(d2.total)],['Акции',percent(d1.equityValue/d1.total),percent(d2.equityValue/d2.total)],['Облигации',percent(d1.bondValue/d1.total),percent(d2.bondValue/d2.total)],['Топ-1',percent(d1.top1),percent(d2.top1)],['HHI',d1.hhi.toFixed(4),d2.hhi.toFixed(4)],['Дюрация облигаций, лет',d1.bondDuration.toFixed(2),d2.bondDuration.toFixed(2)],['Сценарий +100 б.п., весь портфель',percent(d1.rateShock100bp),percent(d2.rateShock100bp)]];
 const prior=new Map(d1.rows.map(x=>[x.ticker,x])),next=new Map(d2.rows.map(x=>[x.ticker,x]));
 // Show trades and price changes even when the resulting market value is identical.
 const changes=[...new Set([...prior.keys(),...next.keys()])].map(name=>{
  const before=prior.get(name),after=next.get(name);
  return {name,oldValue:before?.value||0,newValue:after?.value||0,
   oldQty:before?.qty||0,newQty:after?.qty||0,oldPrice:before?.price??null,newPrice:after?.price??null,
    oldDuration:before?.duration??null,newDuration:after?.duration??null};
 }).filter(x=>Math.abs(x.oldValue-x.newValue)>0.005||x.oldQty!==x.newQty||x.oldPrice!==x.newPrice||x.oldDuration!==x.newDuration)
 .sort((x,y)=>Math.abs(y.newValue-y.oldValue)-Math.abs(x.newValue-x.oldValue));
 return {metrics,changes};
}

async function loadSnapshots(){

function compareSnapshots(){
 const a=snapshotsCache.get(document.getElementById('snapshot-from')?.value),b=snapshotsCache.get(document.getElementById('snapshot-to')?.value);
 const output=document.getElementById('snapshot-diff');if(!a||!b||!output)return;
 try{
  const diff=snapshotDiff(snapshotProfile(a),snapshotProfile(b));output.textContent='';
  const title=document.createElement('h3');title.textContent='Версия 1 → Версия 2';output.append(title);
  for(const line of diff.metrics){const p=document.createElement('p');p.textContent=line[0]+': '+line[1]+' → '+line[2];output.append(p)}
  const h=document.createElement('h3');h.textContent='Изменения по инструментам';output.append(h);
  const fmt=n=>n===null?'—':n.toLocaleString('en-US',{maximumFractionDigits:8});
  const p=document.createElement('p');p.textContent=diff.changes.length?diff.changes.slice(0,30).map(c=>c.name+': кол-во '+fmt(c.oldQty)+' → '+fmt(c.newQty)+'; цена '+fmt(c.oldPrice)+' → '+fmt(c.newPrice)+' USD; стоимость '+fmt(c.oldValue)+' → '+fmt(c.newValue)+' USD'+(c.oldDuration!==null||c.newDuration!==null?'; мод. дюрация '+fmt(c.oldDuration)+' → '+fmt(c.newDuration)+' лет':'')).join('\n'):'Количества, цены и стоимости позиций совпадают.';p.style.whiteSpace='pre-wrap';output.append(p);
  const note=document.createElement('p');note.textContent='Сравнение отражает изменение введённых стоимостей, включая сделки и изменение цен. Не является расчётом доходности.';output.append(note);
 }catch(err){output.textContent='Ошибка сравнения: '+err.message}
}

async function importData(file){
 if(!file)return;
 const importRevision=authRevision,importOwner=session?.user?.id||null;
 const importIsCurrent=()=>authRevision===importRevision&&(session?.user?.id||null)===importOwner;
 let parsed;
 try{parsed=JSON.parse(await file.text())}
 catch{if(importIsCurrent())toast('Файл не является JSON');return}
 if(!importIsCurrent())return;
 const data=Array.isArray(parsed)?parsed:parsed?.entries;
 if(!Array.isArray(data)||data.length>1000||data.some(x=>!x||typeof x!=='object'||Array.isArray(x)||!Object.hasOwn(section,x.kind)||typeof x.title!=='string'||!x.title.trim()||x.title.length>180||['status','notes','prompt','chat_url'].some(k=>x[k]!==undefined&&(typeof x[k]!=='string'||x[k].length>50000)))){
  toast('Неподходящий формат копии или более 1000 записей');return;
 }
 if(!confirm('Добавить '+data.length+' записей в текущий кабинет?')||!importIsCurrent())return;
 let count=0;
 for(const x of data){
  if(!importIsCurrent())return;
  const e={...draft(x.kind),kind:x.kind,title:x.title.trim(),status:x.status??'Новая',notes:x.notes??'',prompt:x.prompt??section[x.kind].prompt,chat_url:x.chat_url??''};
  if(await persist(e))count++;
  if(!importIsCurrent())return;
 }
 render();toast('Импортировано записей: '+count);
}
document.addEventListener('click',async ev=>{let b=ev.target.closest('[data-action]');if(!b||busy)return;let a=b.dataset.action;const actionRevision=authRevision;busy=true;try{if(a==='nav'){if(b.dataset.page==='tasks')window.location.href='./tasks-board.html';else nav(b.dataset.page)}if(a==='new')create(b.dataset.kind);if(a==='createcase')await submitNewCase();if(a==='cancelnew'){newCaseKind=null;render()}if(a==='open'){newCaseKind=null;active=b.dataset.id;render()}if(a==='back')nav(b.dataset.kind);if(a==='save')await saveDetail(b.dataset.id);if(a==='delete')await deleteItem(b.dataset.id);if(a==='copy')await copyCase(b.dataset.id);if(a==='loadholdings')document.getElementById('holdings-file')?.click();if(a==='downloadtemplate')downloadHoldingsTemplate();if(a==='calcportfolio')calculatePortfolio();if(a==='saveportfolio')await savePortfolio();if(a==='savesnapshot')await saveSnapshot();if(a==='listsnapshots')await loadSnapshots();if(a==='comparesnapshots')compareSnapshots();if(a==='restoresnapshot')restoreSnapshot();if(a==='chat')openChat(b.dataset.id);if(a==='login'||a==='signup')await authenticate(a);if(a==='forgot')await forgotPassword();if(a==='updatepassword')await updatePassword();if(a==='refresh')await refresh();if(a==='logout')await signout();if(a==='export')exportData();if(a==='import')document.getElementById('importfile').click()}finally{if(actionRevision===authRevision)busy=false}});
document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render()}if(e.target.id==='importfile')importData(e.target.files[0]);if(e.target.id==='holdings-file')importHoldingsFile(e.target.files[0])});
document.addEventListener('input',e=>{if(e.target.id==='search'){needle=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById('search');el.focus();el.setSelectionRange(pos,pos)}});
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.page==='tasks')window.location.assign('./tasks-board.html');else nav(b.dataset.page)}));
(async()=>{if(cfg.url&&cfg.key&&!window.supabase?.createClient)toast('Не загрузилась библиотека входа. Проверь интернет и обнови страницу.');if(cfg.url&&cfg.key&&window.supabase?.createClient){try{cloud=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true}});cloud.auth.onAuthStateChange((event,nextSession)=>handleWorkspaceAuthChange(event,nextSession));const initialRevision=authRevision;const r=await cloud.auth.getSession();if(initialRevision===authRevision&&r.data.session&&!session)handleWorkspaceAuthChange('SIGNED_IN',r.data.session)}catch(e){toast('Ошибка подключения к облаку: '+e.message)}}render()})();
</script></body></html>
