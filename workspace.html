<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advisor AI · Рабочий кабинет</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:#e9edf7;background:#0a0f1e;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:#a7c4ff}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #97b9ff;outline-offset:2px}.app{display:grid;grid-template-columns:242px minmax(0,1fr);min-height:100vh}.sidebar{background:#11182a;border-right:1px solid #25334e;padding:27px 14px;display:flex;flex-direction:column;gap:25px}.brand{padding:0 12px;font-size:22px;font-weight:800;letter-spacing:-.7px}.brand em{font-style:normal;color:#80aaff}.brand small{display:block;letter-spacing:1.2px;color:#8191ad;font-size:10px;margin-top:6px;font-weight:600}.nav button{display:block;border:0;text-align:left;background:transparent;color:#b2bed5;padding:13px 14px;margin:2px 0;border-radius:9px;width:100%}.nav button.on,.nav button:hover{color:white;background:#26385a}.sidebar-foot{font-size:12px;color:#8999b5;line-height:1.6;margin-top:auto;padding:12px}.content{padding:32px clamp(18px,4vw,55px);max-width:1500px;width:100%;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.eyebrow{letter-spacing:1.5px;font-weight:750;font-size:11px;color:#90b5ff}.title{font-size:clamp(26px,3.2vw,38px);margin:9px 0 7px;letter-spacing:-1.1px}.sub{color:#a0aec9;line-height:1.6;margin:0 0 26px}.btn{border-radius:10px;padding:10px 15px;border:1px solid #344661;background:#20314f;color:#e0eaff;font-weight:650}.btn.primary{background:#5884ee;color:white;border-color:#5884ee}.btn:hover{filter:brightness(1.12)}.btn.red{border-color:#71434b;color:#ffc7cc;background:#3a202c}.btn:disabled{opacity:.45;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:22px 0}.card,.panel{border-radius:16px;background:#151f33;border:1px solid #2c3c58;padding:19px}.card.click{cursor:pointer}.card.click:hover{border-color:#81a5ed}.card .symbol{font-size:25px}.card h3{font-size:15px;margin:20px 0 5px}.card p{font-size:12px;color:#9aabc8;margin:0;line-height:1.6}.value{font-size:27px;font-weight:800;letter-spacing:-.8px}.value-label{font-size:12px;color:#95a7c7}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.field{border:1px solid #344663;border-radius:10px;padding:12px;background:#0c1526;color:#eaf0ff;width:100%;min-width:0}textarea.field{min-height:130px;resize:vertical}.search{max-width:500px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}.toolbar .field{width:auto;flex:1;min-width:210px}.toolbar select.field{flex:0 1 180px;min-width:120px}.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(270px,.8fr);gap:17px}.panel h2{margin:0 0 16px;font-size:17px}.item{display:flex;align-items:center;gap:14px;border-top:1px solid #2a3a55;padding:15px 2px}.item:first-of-type{border-top:0}.item-main{min-width:0;flex:1}.item strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item small{color:#93a5c5;display:block;margin-top:6px}.pill{border:1px solid #3b527a;background:#223453;color:#bdd6ff;border-radius:30px;padding:4px 9px;font-size:11px;white-space:nowrap}.tag{font-size:12px;color:#89b5ff}.empty{color:#96a6c5;padding:24px 0;line-height:1.6}.notice{font-size:13px;line-height:1.6;border:1px solid #405578;border-radius:11px;background:#1a2a43;color:#cbdaef;padding:14px 17px;margin:17px 0}.notice.warn{border-color:#86683a;color:#ffe0a4;background:#302718}.label{display:block;color:#a4b6d5;font-size:12px;font-weight:600;margin:16px 0 7px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.note{font-size:12px;color:#93a5c2;line-height:1.6}.hide{display:none!important}.good{color:#9ee1b1}.bad{color:#ffd29c}.statrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:18px 0}.statbox{border:1px solid #2c3c58;background:#151f33;border-radius:13px;padding:19px}#toast{display:none;position:fixed;right:18px;bottom:18px;background:#365a8b;padding:13px 17px;border-radius:10px;max-width:370px;z-index:5;color:white}.linkbtn{background:transparent;border:0;color:#9cbeff;cursor:pointer;text-decoration:underline;padding:0}.mono{font-family:ui-monospace,monospace;overflow-wrap:anywhere;font-size:12px}
@media(max-width:1020px){.cards,.statrow{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{padding:13px;gap:11px}.brand small,.sidebar-foot{display:none}.nav{display:flex;overflow:auto;gap:5px}.nav button{white-space:nowrap;padding:10px}.content{padding:22px 14px}.formgrid{grid-template-columns:1fr}.cards,.statrow{gap:9px}.card,.panel{padding:14px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">◈ Advisor <em>AI</em><small>PERSONAL WORKSPACE</small></div><nav class="nav" id="nav"><button data-page="home">⌂ &nbsp; Главная</button><button data-page="portfolio">▤ &nbsp; Портфели</button><button data-page="ideas">✧ &nbsp; Идеи</button><button data-page="academy">◈ &nbsp; Обучение</button><button data-page="markets">◉ &nbsp; Рынки</button><button data-page="tasks">☑ &nbsp; Задачи</button><button data-page="settings">⚙ &nbsp; Настройки</button></nav><div class="sidebar-foot">Личный рабочий кабинет<br><span id="sideMode">Локальные данные</span><br><a href="./">← Основной сайт</a></div></aside><main class="content" id="view"></main></div><div id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script>
'use strict';
const KEY='advisor-ai-personal-v1', CONF='advisor-ai-cloud-config-v1';
const section={portfolio:{label:'Портфели',icon:'▤',desc:'Отдельный кейс на каждый портфель. Концентрации, стратегия, ребалансировка.',prompt:'Помоги проанализировать обезличенный инвестиционный портфель. Сначала уточни недостающие данные, затем оцени риски, диверсификацию, длительность, фундаментальную устойчивость позиций и варианты ребалансировки.'},ideas:{label:'Идеи',icon:'✧',desc:'Тикеры, тезисы, катализаторы, риски и этапы проверки.',prompt:'Проведи фундаментальное исследование инвестиционной идеи: бизнес, рост, финансовые показатели, оценка, конкуренция, катализаторы, риски и сценарии. Начни с уточнения тикера и инвестиционного горизонта.'},academy:{label:'Обучение',icon:'◈',desc:'Темы, прогресс, вопросы, конспекты и связь с конкретным чатом.',prompt:'Продолжи моё обучение Advisor Academy. Сначала объясняй простым языком с точной терминологией, причинно-следственными связями, примерами и исключениями. Только затем проверяй понимание.'},markets:{label:'Рынки',icon:'◉',desc:'Макросценарии, ФРС, инфляция, нефть и рыночные последствия.',prompt:'Разбери актуальное макроэкономическое событие: причины, механизм, связь с инфляцией, ставками, занятостью, валютами, облигациями и акциями. Раздели факты и сценарии.'},tasks:{label:'Задачи',icon:'☑',desc:'Обязательства и следующие действия по каждому кейсу.',prompt:'Помоги составить краткий план действий и приоритеты по этой рабочей задаче.'}};
const statuses=['Новая','В работе','Ожидание','Готово'];
let entries=[],page='home',active=null,needle='',filter='all',cloud=null,session=null,busy=false;
let cfg; try{cfg=JSON.parse(localStorage.getItem(CONF)||'{}')}catch{cfg={}};
const now=()=>new Date().toISOString(),uid=()=>crypto.randomUUID(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(d)?d:[]}catch{return []}} entries=load();
function saveLocal(){localStorage.setItem(KEY,JSON.stringify(entries));}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',4200)}
const fmt=s=>s?new Date(s).toLocaleDateString('ru-RU',{day:'2-digit',month:'short',year:'numeric'}):'—';
const order=xs=>[...xs].sort((a,b)=>String(b.updated_at||'').localeCompare(String(a.updated_at||'')));
const validChat=x=>!x||/^https:\/\/chatgpt\.com\/(c\/|share\/|g\/|gpt\/)/.test(x);
const isCloud=()=>Boolean(cloud&&session);
function draft(type){return{id:uid(),kind:type,title:'',status:'Новая',notes:'',prompt:section[type].prompt,chat_url:'',created_at:now(),updated_at:now()}}
function pageTitle(title,sub){return `<div class="eyebrow">ADVISOR AI / WORKSPACE</div><h1 class="title">${title}</h1><p class="sub">${sub}</p>`}
function nav(p){page=p;active=null;needle='';filter='all';render()}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.page===page));document.getElementById('sideMode').textContent=isCloud()?'● Облако · личный аккаунт':'● Локальные данные · этот браузер';let e=entries.find(x=>x.id===active);document.getElementById('view').innerHTML=e?detail(e):page==='home'?home():page==='settings'?settings():listPage(page);}
function summary(items){const live=items.filter(x=>x.status==='В работе').length,pending=items.filter(x=>x.status==='Ожидание').length,done=items.filter(x=>x.status==='Готово').length;return `<div class="statrow"><div class="statbox"><div class="value">${items.length}</div><div class="value-label">Всего кейсов</div></div><div class="statbox"><div class="value">${live}</div><div class="value-label">В работе</div></div><div class="statbox"><div class="value">${pending}</div><div class="value-label">В ожидании</div></div><div class="statbox"><div class="value">${done}</div><div class="value-label">Завершено</div></div></div>`}
function itemRow(e){let s=section[e.kind];return `<div class="item"><div style="font-size:24px">${s.icon}</div><div class="item-main"><strong>${esc(e.title)}</strong><small>${s.label} · ${fmt(e.updated_at)} · ${e.chat_url?'Чат привязан':'Без ссылки на чат'}</small></div><span class="pill">${esc(e.status)}</span><button class="btn" data-action="open" data-id="${e.id}">Открыть →</button></div>`}
function home(){const recent=order(entries).slice(0,7);return pageTitle('Мой рабочий кабинет','Портфели, инвестиционные идеи, обучение и задачи — каждый кейс в одном месте.')+(!isCloud()?'<div class="notice warn"><strong>Сейчас записи хранятся только в этом браузере.</strong> Они работают уже сейчас, но не синхронизируются с другим компьютером. Для облачного хранения открой «Настройки» и подключи личный аккаунт. Не сохраняй конфиденциальные данные клиентов до настройки доступа и согласования с компанией.</div>':'<div class="notice good">Облачное хранение подключено. Записи доступны после входа в твой аккаунт.</div>')+summary(entries)+`<div class="cards">${Object.entries(section).filter(([k])=>k!=='tasks').map(([k,v])=>`<div class="card click" data-action="nav" data-page="${k}"><div class="symbol">${v.icon}</div><h3>${v.label}</h3><p>${v.desc}</p></div>`).join('')}</div><div class="split"><div class="panel"><div class="row between"><h2>Последние кейсы</h2><button class="btn" data-action="nav" data-page="tasks">Все записи</button></div>${recent.length?recent.map(itemRow).join(''):'<div class="empty">Пока нет кейсов. Создай первый портфель, идею или учебную тему.</div>'}</div><div class="panel"><h2>Быстрый старт</h2><p class="sub">Каждый кейс хранит заметки, статус и ссылку на конкретный чат ChatGPT.</p><div class="tools"><button class="btn primary" data-action="new" data-kind="portfolio">+ Портфель</button><button class="btn" data-action="new" data-kind="ideas">+ Идея</button><button class="btn" data-action="new" data-kind="academy">+ Тема</button></div><div class="notice">Связь с ChatGPT: в кейсе нажми «Скопировать запрос», вставь его в ChatGPT, а затем сохрани ссылку на этот разговор. Автоматической синхронизации истории чатов нет.</div></div></div>`}
function listPage(k){let base=k==='tasks'?entries:entries.filter(x=>x.kind===k),res=order(base.filter(x=>(filter==='all'||x.status===filter)&&(!needle||[x.title,x.notes,x.prompt,x.kind].join(' ').toLowerCase().includes(needle.toLowerCase()))));return pageTitle(section[k].label,section[k].desc)+`<div class="toolbar"><input id="search" class="field" placeholder="Поиск по названиям и заметкам..." value="${esc(needle)}"><select id="filter" class="field">${['all',...statuses].map(s=>`<option value="${esc(s)}" ${filter===s?'selected':''}>${s==='all'?'Все статусы':s}</option>`).join('')}</select><button class="btn primary" data-action="new" data-kind="${k==='tasks'?'tasks':k}">+ Новый кейс</button></div><div class="panel">${res.length?res.map(itemRow).join(''):'<div class="empty">Записей пока нет или ничего не найдено. Создай новый кейс кнопкой выше.</div>'}</div>`}
function detail(e){return pageTitle(esc(e.title),section[e.kind].label+' · '+fmt(e.updated_at))+`<div class="tools"><button class="btn" data-action="back" data-kind="${e.kind}">← Все ${section[e.kind].label.toLowerCase()}</button><button class="btn primary" data-action="copy" data-id="${e.id}">Скопировать запрос для AI</button><button class="btn" data-action="chat" data-id="${e.id}" ${!e.chat_url?'disabled':''}>Открыть сохранённый чат ↗</button></div><div class="split"><div class="panel"><h2>Карточка кейса</h2><label class="label">Название</label><input class="field" id="f-title" value="${esc(e.title)}" maxlength="180"><div class="formgrid"><div><label class="label">Раздел</label><select id="f-kind" class="field">${Object.entries(section).map(([k,v])=>`<option value="${k}" ${e.kind===k?'selected':''}>${v.label}</option>`).join('')}</select></div><div><label class="label">Статус</label><select id="f-status" class="field">${statuses.map(s=>`<option ${e.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><label class="label">Заметки / следующий шаг</label><textarea class="field" id="f-notes" placeholder="Выводы, гипотезы, дата проверки, следующие действия...">${esc(e.notes)}</textarea><label class="label">Текст запроса для Advisor AI</label><textarea class="field" id="f-prompt">${esc(e.prompt)}</textarea><div class="tools"><button class="btn primary" data-action="save" data-id="${e.id}">Сохранить изменения</button><button class="btn red" data-action="delete" data-id="${e.id}">Удалить</button></div><p class="note">В облачном режиме данные сохраняются в базе только после нажатия «Сохранить изменения».</p></div><div class="panel"><h2>Ссылка на конкретный чат</h2><p class="sub">Здесь хранится адрес ровно того диалога ChatGPT, в котором ты работаешь с этим кейсом. Так не придётся искать его среди тысяч разговоров.</p><input class="field" id="f-chat" placeholder="https://chatgpt.com/c/..." value="${esc(e.chat_url)}"><div class="tools"><button class="btn" data-action="save" data-id="${e.id}">Сохранить ссылку</button><button class="btn" data-action="copy" data-id="${e.id}">Копировать запрос</button></div><div class="notice">Открой новый чат с Advisor AI, вставь скопированный запрос, затем скопируй адрес диалога из браузера сюда. Позже нажимай «Открыть сохранённый чат» — и сразу продолжишь работу.</div><a href="https://chatgpt.com/" target="_blank" rel="noopener">Открыть ChatGPT ↗</a></div></div>`}
async function persist(e){if(!isCloud()){let i=entries.findIndex(x=>x.id===e.id);if(i<0)entries.push(e);else entries[i]=e;saveLocal();return true}const row={...e,user_id:session.user.id};const {error}=await cloud.from('workspace_items').upsert(row,{onConflict:'id'});if(error){toast('Ошибка облачного сохранения: '+error.message);return false}let i=entries.findIndex(x=>x.id===e.id);if(i<0)entries.push(e);else entries[i]=e;return true}
async function remove(id){if(isCloud()){let {error}=await cloud.from('workspace_items').delete().eq('id',id);if(error){toast('Ошибка удаления: '+error.message);return false}}entries=entries.filter(x=>x.id!==id);if(!isCloud())saveLocal();return true}
async function refresh(){if(!isCloud())return;let {data,error}=await cloud.from('workspace_items').select('id,kind,title,status,notes,prompt,chat_url,created_at,updated_at').order('updated_at',{ascending:false}).limit(1000);if(error){toast('Не удалось загрузить облачные записи: '+error.message);return}entries=data||[];render()}
async function create(kind){let name=prompt('Название нового кейса:');if(name===null)return;name=name.trim();if(!name){toast('Укажи название');return}let e=draft(kind);e.title=name; if(await persist(e)){active=e.id;page=kind;render();toast('Кейс создан')}}
async function saveDetail(id){let e=entries.find(x=>x.id===id);if(!e)return;let title=document.getElementById('f-title').value.trim(),chat=document.getElementById('f-chat').value.trim();if(!title){toast('Нужен заголовок кейса');return}if(!validChat(chat)){toast('Ссылка должна начинаться с https://chatgpt.com/c/...');return}let updated={...e,title,kind:document.getElementById('f-kind').value,status:document.getElementById('f-status').value,notes:document.getElementById('f-notes').value,prompt:document.getElementById('f-prompt').value,chat_url:chat,updated_at:now()};if(await persist(updated)){render();toast('Изменения сохранены')}}
async function deleteItem(id){if(!confirm('Удалить этот кейс без возможности восстановления?'))return;if(await remove(id)){active=null;render();toast('Кейс удалён')}}
async function copyCase(id){let e=entries.find(x=>x.id===id);if(!e)return;let txt=e.prompt+'\n\nРабочий контекст:\n'+(e.notes||'Пока нет заметок')+'\n\nПожалуйста, уточняй недостаточные данные и не выдумывай цифры.';try{await navigator.clipboard.writeText(txt);toast('Запрос скопирован. Вставь его в ChatGPT: Ctrl+V.')}catch{prompt('Скопируй запрос вручную:',txt)}}
function openChat(id){let e=entries.find(x=>x.id===id);if(e?.chat_url)window.open(e.chat_url,'_blank','noopener')}
function settings(){return pageTitle('Настройки','Подключи защищённое облачное хранение, чтобы работать с разных устройств.')+`<div class="split"><div class="panel"><h2>Хранение данных</h2><div class="notice ${isCloud()?'':'warn'}">${isCloud()?'● Облако активно. Записи загружаются из личной базы после входа.':'● Пока локальный режим. Записи доступны только в браузере, в котором созданы. Для постоянного личного кабинета подключим Supabase.'}</div>${isCloud()?`<div class="tools"><button class="btn" data-action="refresh">Обновить из облака</button><button class="btn" data-action="logout">Выйти из аккаунта</button></div><p class="note">Пользователь: ${esc(session.user.email||'')}</p>`:`<label class="label">Supabase Project URL</label><input id="cloud-url" class="field" placeholder="https://xxxx.supabase.co" value="${esc(cfg.url||'')}"><label class="label">Supabase Publishable / anon key</label><textarea id="cloud-key" class="field" style="min-height:80px" placeholder="sb_publishable_... или публичный anon key">${esc(cfg.key||'')}</textarea><div class="tools"><button class="btn primary" data-action="connectcloud">Подключить базу</button></div><p class="note">Ключ должен быть только публичным (publishable/anon), никогда не вставляй service_role или secret key. Перед первым подключением выполняется SQL-настройка таблицы и правил доступа.</p>${cloud?'<div class="notice">Подключение настроено. Введи email и пароль Supabase ниже, затем нажми «Войти».</div><label class="label">Email</label><input id="login-email" type="email" class="field" autocomplete="email"><label class="label">Пароль</label><input id="login-pass" type="password" class="field" autocomplete="current-password"><div class="tools"><button class="btn primary" data-action="login">Войти</button><button class="btn" data-action="signup">Создать аккаунт</button></div><p class="note">При регистрации Supabase может попросить подтвердить email. После подтверждения вернись на эту страницу и войди.</p>':''}`}</div><div class="panel"><h2>Резервное копирование</h2><p class="sub">Сохрани файл с собственными кейсами. Это полезно и для локальной, и для облачной версии.</p><div class="tools"><button class="btn" data-action="export">↓ Скачать копию JSON</button><button class="btn" data-action="import">↑ Импорт JSON</button><input id="importfile" class="hide" type="file" accept="application/json"></div><div class="notice warn">Облачный режим использует авторизацию и правила доступа Supabase, но это не корпоративное хранилище Freedom. Не загружай ФИО, номера счетов, брокерские выписки и другие закрытые клиентские данные без согласования с комплаенсом.</div><p class="note">Данные ChatGPT не переносятся в кабинет автоматически. Здесь хранятся только твои записи и ссылки на конкретные чаты.</p></div></div>`}
async function connectCloud(){let url=document.getElementById('cloud-url').value.trim().replace(/\/$/,''),key=document.getElementById('cloud-key').value.trim();if(!/^https:\/\/[\w-]+\.supabase\.co$/.test(url)||key.length<20){toast('Проверь адрес Supabase и публичный ключ');return}if(!window.supabase?.createClient){toast('Не загрузилась библиотека Supabase; проверь интернет');return}cfg={url,key};localStorage.setItem(CONF,JSON.stringify(cfg));cloud=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true}});let {data,error}=await cloud.auth.getSession();if(error){toast(error.message);return}session=data.session;render();if(session)await refresh();else toast('База подключена. Теперь войди или создай аккаунт.')}
async function authenticate(mode){if(!cloud)return;let email=document.getElementById('login-email').value.trim(),password=document.getElementById('login-pass').value;if(!email||password.length<6){toast('Введи email и пароль минимум 6 символов');return}let {data,error}=mode==='signup'?await cloud.auth.signUp({email,password}):await cloud.auth.signInWithPassword({email,password});if(error){toast(error.message);return}session=data.session;if(!session){toast('Проверь почту и подтверди регистрацию, затем войди.');return}await refresh();toast('Вход выполнен. Загружены личные облачные записи.')}
async function signout(){await cloud.auth.signOut();session=null;entries=load();render();toast('Выход выполнен. Отображаются локальные записи этого браузера.')}
function exportData(){let blob=new Blob([JSON.stringify({exported_at:now(),entries},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='advisor-ai-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function importData(file){if(!file)return;let parsed;try{parsed=JSON.parse(await file.text())}catch{toast('Файл не является JSON');return}let data=Array.isArray(parsed)?parsed:parsed.entries;if(!Array.isArray(data)||data.some(x=>!section[x.kind]||!x.title)){toast('Неподходящий формат резервной копии');return}if(!confirm('Добавить '+data.length+' записей в текущий кабинет?'))return;let count=0;for(let x of data){let e={...draft(x.kind),...x,id:uid(),created_at:now(),updated_at:now()};delete e.user_id;if(await persist(e))count++}render();toast('Импортировано записей: '+count)}
document.addEventListener('click',async ev=>{let b=ev.target.closest('[data-action]');if(!b||busy)return;let a=b.dataset.action;busy=true;try{if(a==='nav')nav(b.dataset.page);if(a==='new')await create(b.dataset.kind);if(a==='open'){active=b.dataset.id;render()}if(a==='back')nav(b.dataset.kind);if(a==='save')await saveDetail(b.dataset.id);if(a==='delete')await deleteItem(b.dataset.id);if(a==='copy')await copyCase(b.dataset.id);if(a==='chat')openChat(b.dataset.id);if(a==='connectcloud')await connectCloud();if(a==='login'||a==='signup')await authenticate(a);if(a==='refresh')await refresh();if(a==='logout')await signout();if(a==='export')exportData();if(a==='import')document.getElementById('importfile').click()}finally{busy=false}});
document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render()}if(e.target.id==='importfile')importData(e.target.files[0])});
document.addEventListener('input',e=>{if(e.target.id==='search'){needle=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById('search');el.focus();el.setSelectionRange(pos,pos)}});
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));
(async()=>{if(cfg.url&&cfg.key&&window.supabase?.createClient){try{cloud=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true}});const r=await cloud.auth.getSession();session=r.data.session;if(session)await refresh()}catch(e){toast('Ошибка подключения к облаку: '+e.message)}}render()})();
</script></body></html>
