async function persist(e){if(!isCloud()){let i=entries.findIndex(x=>x.id===e.id);if(i<0)entries.push(e);else entries[i]=e;saveLocal();return true}const row={...e,user_id:session.user.id};const {error}=await cloud.from('workspace_items').upsert(row,{onConflict:'id'});if(error){toast('Ошибка облачного сохранения: '+error.message);return false}let i=entries.findIndex(x=>x.id===e.id);if(i<0)entries.push(e);else entries[i]=e;return true}

async function refresh(){if(!isCloud())return;let {data,error}=await cloud.from('workspace_items').select('id,kind,title,status,notes,prompt,chat_url,created_at,updated_at').order('updated_at',{ascending:false}).limit(1000);if(error){toast('Не удалось загрузить облачные записи: '+error.message);return}entries=data||[];const deep=new URLSearchParams(window.location.search).get('case');if(deep&&entries.some(x=>x.id===deep)){active=deep;newCaseKind=null;page=entries.find(x=>x.id===deep).kind;}render()}
function newCaseForm(kind){return pageTitle('Новый кейс','Выбери раздел и заполни название. Остальное можно добавить позже.')+
`<div class="panel" style="max-width:800px"><h2>Создание кейса</h2><label class="label" for="new-kind">Раздел</label><select class="field" id="new-kind">${Object.entries(section).map(([k,v])=>`<option value="${k}" ${k===kind?'selected':''}>${v.label}</option>`).join('')}</select><label class="label" for="new-title">Название</label><input class="field" id="new-title" maxlength="180" placeholder="Например: портфель роста, Tesla, инфляция США" autocomplete="off"><label class="label" for="new-notes">Заметки или цель (необязательно)</label><textarea id="new-notes" class="field" placeholder="Что нужно проанализировать, изучить или сделать?" maxlength="4000"></textarea><div class="tools"><button class="btn primary" data-action="createcase">Создать кейс</button><button class="btn" data-action="cancelnew">Отмена</button></div><p class="note">После создания откроется карточка и станет доступен отдельный AI-чат с собственной историей.</p></div>`}

async function submitNewCase(){const title=document.getElementById('new-title')?.value.trim();const kind=document.getElementById('new-kind')?.value;const notes=document.getElementById('new-notes')?.value.trim()||'';if(!title){toast('Укажи название кейса.');document.getElementById('new-title')?.focus();return}if(!section[kind]){toast('Выбери раздел.');return}let e=draft(kind);e.title=title;e.notes=notes;if(await persist(e)){newCaseKind=null;active=e.id;page=kind;render();toast('Кейс создан. Можно открыть AI-чат.')}}

const PORT_START='[ADVISOR_AI_PORTFOLIO_BEGIN]',PORT_END='[ADVISOR_AI_PORTFOLIO_END]';
function parseHoldings(text){
 const lines=String(text||'').trim().split(/\r?\n/).filter(Boolean);if(!lines.length)throw Error('Вставь список позиций.');
 if(lines.length>151)throw Error('Максимум 150 строк за один раз.');
 const rows=[];let seen=new Set();
 for(let k=0;k<lines.length;k++){
  const v=lines[k].split(/[;\t]/).map(x=>x.trim());if(k===0&&/тикер|ticker|symbol/i.test(v[0]))continue;
  if(v.length!==3)throw Error('Строка '+(k+1)+': нужны три колонки: тикер; количество; цена.');
  const [ticker,qtyText,priceText]=v;
  if(!/^[A-Za-z0-9.^_-]{1,24}$/.test(ticker))throw Error('Строка '+(k+1)+': неверный тикер.');
  const qty=Number(qtyText.replace(',','.')),price=Number(priceText.replace(',','.'));
  if(!Number.isFinite(qty)||qty<=0||!Number.isFinite(price)||price<0)throw Error('Строка '+(k+1)+': количество должно быть больше нуля, цена не может быть отрицательной.');
  if(seen.has(ticker.toUpperCase()))throw Error('Повторяющийся тикер '+ticker+'. Объедини позиции.');
  seen.add(ticker.toUpperCase());
  const value=qty*price;if(!Number.isFinite(value)||value>1e12)throw Error('Строка '+(k+1)+': слишком большое значение.');
  rows.push({ticker:ticker.toUpperCase(),qty,price,value});
 }
 if(!rows.length)throw Error('Нет позиций для расчёта.');
 const total=rows.reduce((acc,r)=>acc+r.value,0);if(!total)throw Error('Общая стоимость равна нулю.');
 rows.sort((a,b)=>b.value-a.value);
 const weights=rows.map(r=>r.value/total),hhi=weights.reduce((acc,w)=>acc+w*w,0);
 return {rows,total,top1:weights[0],top3:weights.slice(0,3).reduce((a,w)=>a+w,0),top5:weights.slice(0,5).reduce((a,w)=>a+w,0),hhi,effectiveCount:1/hhi,largestShock:-.2*rows[0].value/total};
}
function savedHoldings(notes){const a=(notes||'').indexOf(PORT_START),b=(notes||'').indexOf(PORT_END,a+PORT_START.length);if(a<0||b<0)return '';const body=notes.slice(a+PORT_START.length,b);const match=body.match(/Список позиций \(тикер; количество; цена в USD\):\n([\s\S]*?)\nИтого:/);return match?match[1].trim():''}
function portfolioPanel(e){return `<div class="panel" style="margin-top:18px"><h2>Структура портфеля</h2><p class="sub">Вставь обезличенный список: тикер; количество; цена одной бумаги в USD. Каждая позиция с новой строки. Данные вводятся вручную: рыночные котировки здесь не обновляются.</p><label class="label" for="holdings-input">Позиции (до 150)</label><textarea id="holdings-input" class="field" style="min-height:160px" placeholder="AAPL; 10; 250&#10;MSFT; 5; 400&#10;NVDA; 8; 150">${esc(savedHoldings(e.notes))}</textarea><div class="tools"><button class="btn" data-action="loadholdings">↑ Загрузить CSV/TSV</button><input id="holdings-file" type="file" class="hide" accept=".csv,.tsv,.txt,text/csv,text/plain"><button class="btn" data-action="calcportfolio">Рассчитать структуру</button><button class="btn primary" data-action="saveportfolio">Сохранить позиции и расчёт</button></div><p class="note">Облигации: <a href="./bond-analysis.html" target="_blank" rel="noopener">Рассчитать текущую доходность, YTM и дюрацию →</a></p><div id="portfolio-preview" class="notice" aria-live="polite">Показатели появятся после расчёта. Все суммы и доли основаны на введённых ценах. Стресс-тесты гипотетические.</div></div>`}
function buildPortfolioText(summary){const f=n=>n.toLocaleString('en-US',{maximumFractionDigits:2}),pct=n=>(n*100).toFixed(1)+'%';
 const primary='Итого по введённым ценам: '+f(summary.total)+' USD; позиций: '+summary.rows.length+'; крупнейшая: '+summary.rows[0].ticker+' ('+pct(summary.top1)+'); топ-3: '+pct(summary.top3)+'; топ-5: '+pct(summary.top5)+'.';
 const risk='HHI: '+summary.hhi.toFixed(4)+'; эффективное число позиций: '+summary.effectiveCount.toFixed(2)+'. Условный стресс: '+summary.rows[0].ticker+' -20% при неизменных остальных -> портфель '+pct(summary.largestShock)+'; все позиции -10% -> портфель -10.0%.';
 const top='Крупнейшие позиции: '+summary.rows.slice(0,10).map(r=>r.ticker+' '+pct(r.value/summary.total)).join(', ')+'.';
 return PORT_START+'\nКРАТКАЯ СВОДКА ДЛЯ AI:\n'+primary+'\n'+risk+'\n'+top+'\nБез верификации котировок и полноты портфеля.\nСписок позиций (тикер; количество; цена в USD):\n'+summary.rows.map(r=>r.ticker+'; '+r.qty+'; '+r.price).join('\n')+'\nИтого: '+f(summary.total)+' USD\n'+PORT_END;
}
function summarizeHoldings(summary){const fmt=n=>n.toLocaleString('en-US',{maximumFractionDigits:2});const pct=n=>(n*100).toFixed(1)+'%';return 'Стоимость по введённым ценам: '+fmt(summary.total)+' USD.\nПозиций: '+summary.rows.length+'. Крупнейшая: '+summary.rows[0].ticker+' ('+pct(summary.top1)+'). Топ-3: '+pct(summary.top3)+'. Топ-5: '+pct(summary.top5)+'.\nHHI: '+summary.hhi.toFixed(4)+'. Эффективное число позиций: '+summary.effectiveCount.toFixed(2)+'.\nУсловный стресс: '+summary.rows[0].ticker+' -20% при прочих равных → портфель '+pct(summary.largestShock)+'. Все позиции -10% → портфель -10.0%.\n\n'+summary.rows.slice(0,30).map(r=>r.ticker+' · '+fmt(r.value)+' USD · '+pct(r.value/summary.total)).join('\n')+(summary.rows.length>30?'\n… и ещё '+(summary.rows.length-30)+' позиций.':'')}
async function importHoldingsFile(file){if(!file)return;const preview=document.getElementById('portfolio-preview');if(file.size>50000){if(preview)preview.textContent='Файл слишком большой. Максимум 50 КБ.';return}try{let raw=await file.text();raw=raw.replace(/^\uFEFF/,'').trim();if(!raw)throw Error('Файл пустой.');const lines=raw.split(/\r?\n/);if(!raw.includes(';')&&!raw.includes('\t'))raw=lines.map(l=>l.split(',').join(';')).join('\n');const input=document.getElementById('holdings-input');if(!input)return;const check=parseHoldings(raw);input.value=raw;if(preview)preview.textContent='Файл загружен. '+summarizeHoldings(check)+'\nНажми «Сохранить позиции и расчёт», чтобы сохранить результат в кейсе.'}catch(e){if(preview)preview.textContent='Не удалось прочитать CSV/TSV: '+e.message}}
function calculatePortfolio(){const el=document.getElementById('portfolio-preview');if(!el)return null;try{const data=parseHoldings(document.getElementById('holdings-input').value);el.textContent=summarizeHoldings(data);return data}catch(e){el.textContent='Ошибка: '+e.message;return null}}
async function savePortfolio(){const data=calculatePortfolio();if(!data)return;const e=entries.find(x=>x.id===active);if(!e||e.kind!=='portfolio')return;
 const currentNotes=document.getElementById('f-notes').value;const a=currentNotes.indexOf(PORT_START),b=currentNotes.indexOf(PORT_END,a+PORT_START.length);
 let freeNotes=(a>=0&&b>a)?(currentNotes.slice(0,a)+currentNotes.slice(b+PORT_END.length)).trim():currentNotes.trim();
 const notes=buildPortfolioText(data)+(freeNotes?'\n\n'+freeNotes:'');if(notes.length>18000){toast('Слишком много текста для карточки. Уменьши количество позиций.');return}
 document.getElementById('f-notes').value=notes;await saveDetail(e.id);
}

async function saveDetail(id){let e=entries.find(x=>x.id===id);if(!e)return;let title=document.getElementById('f-title').value.trim(),chat=document.getElementById('f-chat').value.trim();if(!title){toast('Нужен заголовок кейса');return}if(!validChat(chat)){toast('Ссылка должна начинаться с https://chatgpt.com/c/...');return}let updated={...e,title,kind:document.getElementById('f-kind').value,status:document.getElementById('f-status').value,notes:document.getElementById('f-notes').value,prompt:document.getElementById('f-prompt').value,chat_url:chat,updated_at:now()};if(await persist(updated)){render();toast('Изменения сохранены')}}
async function deleteItem(id){if(!confirm('Удалить этот кейс без возможности восстановления?'))return;if(await remove(id)){active=null;render();toast('Кейс удалён')}}
async function copyCase(id){let e=entries.find(x=>x.id===id);if(!e)return;let txt=e.prompt+'\n\nРабочий контекст:\n'+(e.notes||'Пока нет заметок')+'\n\nПожалуйста, уточняй недостаточные данные и не выдумывай цифры.';try{await navigator.clipboard.writeText(txt);toast('Запрос скопирован. Вставь его в ChatGPT: Ctrl+V.')}catch{prompt('Скопируй запрос вручную:',txt)}}
function openChat(id){let e=entries.find(x=>x.id===id);if(e?.chat_url)window.open(e.chat_url,'_blank','noopener')}
function settings(){if(passwordRecovery&&session)return pageTitle('Установить новый пароль','Восстановление доступа к Advisor AI.')+`<div class="panel" style="max-width:480px"><h2>Новый пароль</h2><label class="label">Пароль от 8 символов</label><input id="new-password" class="field" type="password" autocomplete="new-password" minlength="8"><div class="tools"><button class="btn primary" data-action="updatepassword">Сохранить пароль</button></div></div>`;return pageTitle(isCloud()?'Мой аккаунт':'Вход в Advisor AI',isCloud()?'Настройки аккаунта.':'Войди по email и паролю с любого устройства.')+`<div class="split"><div class="panel"><h2>${isCloud()?'Облачный аккаунт':'Вход / регистрация'}</h2><div class="notice ${isCloud()?'':'warn'}">${isCloud()?'● Облако активно. Записи загружаются из личной базы после входа.':'● Облачная база Advisor AI настроена. Войди или создай личный аккаунт, чтобы увидеть свои записи.'}</div>${isCloud()?`<div class="tools"><button class="btn" data-action="refresh">Обновить из облака</button><button class="btn" data-action="logout">Выйти из аккаунта</button></div><p class="note">Пользователь: ${esc(session.user.email||'')}</p>`:`<label class="label">Email</label><input id="login-email" type="email" class="field" placeholder="name@example.com" autocomplete="email"><label class="label">Пароль</label><input id="login-pass" type="password" class="field" autocomplete="current-password"><div class="tools"><button class="btn primary" data-action="login">Войти</button><button class="btn" data-action="signup">Создать аккаунт</button></div><div class="tools"><button class="linkbtn" data-action="forgot">Забыли пароль?</button></div><p class="note">Войди по email и паролю. При регистрации может понадобиться подтвердить email.</p>`}</div><div class="panel"><h2>Резервное копирование</h2><p class="sub">Сохрани файл с собственными кейсами. Это полезно и для локальной, и для облачной версии.</p><div class="tools"><button class="btn" data-action="export">↓ Скачать копию JSON</button><button class="btn" data-action="import">↑ Импорт JSON</button><input id="importfile" class="hide" type="file" accept="application/json"></div><div class="notice warn">Облачный режим использует авторизацию и правила доступа Supabase, но это не корпоративное хранилище Freedom. Не загружай ФИО, номера счетов, брокерские выписки и другие закрытые клиентские данные без согласования с комплаенсом.</div><p class="note">Данные ChatGPT не переносятся в кабинет автоматически. Здесь хранятся только твои записи и ссылки на конкретные чаты.</p></div></div>`}
async function authenticate(mode){if(!cloud){toast('Не удалось подключить вход. Обнови страницу.');return}let email=document.getElementById('login-email').value.trim(),password=document.getElementById('login-pass').value;if(!email||password.length<6){toast('Введи email и пароль минимум 6 символов');return}let {data,error}=mode==='signup'?await cloud.auth.signUp({email,password,options:{emailRedirectTo:'https://ablaiskiy5.github.io/advisor-ai-website/workspace.html'}}):await cloud.auth.signInWithPassword({email,password});if(error){toast('Не удалось войти: '+error.message);return}session=data.session;if(!session){toast('Проверь почту и подтверди регистрацию, затем войди.');return}await refresh();toast('Вход выполнен. Загружены личные облачные записи.')}
async function forgotPassword(){if(!cloud)return toast('Сервис входа ещё не загрузился.');const email=document.getElementById('login-email')?.value.trim();if(!email){toast('Укажи email для восстановления пароля.');document.getElementById('login-email')?.focus();return}const {error}=await cloud.auth.resetPasswordForEmail(email,{redirectTo:'https://ablaiskiy5.github.io/advisor-ai-website/workspace.html'});if(error){toast('Не удалось отправить ссылку: '+error.message);return}toast('Проверь почту: если аккаунт существует, придёт ссылка для восстановления.')} 
async function updatePassword(){if(!cloud||!session){toast('Открой ссылку восстановления из письма.');return}const f=document.getElementById('new-password');const password=f?.value||'';if(password.length<8){toast('Используй минимум 8 символов.');return}const {error}=await cloud.auth.updateUser({password});if(error){toast('Не удалось сохранить пароль: '+error.message);return}f.value='';passwordRecovery=false;page='home';await refresh();toast('Пароль обновлён.')} 
async function signout(){await cloud.auth.signOut();session=null;entries=[];page='settings';render();toast('Вы вышли из аккаунта.')}
function exportData(){let blob=new Blob([JSON.stringify({exported_at:now(),entries},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='advisor-ai-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function importData(file){if(!file)return;let parsed;try{parsed=JSON.parse(await file.text())}catch{toast('Файл не является JSON');return}let data=Array.isArray(parsed)?parsed:parsed.entries;if(!Array.isArray(data)||data.some(x=>!section[x.kind]||!x.title)){toast('Неподходящий формат резервной копии');return}if(!confirm('Добавить '+data.length+' записей в текущий кабинет?'))return;let count=0;for(let x of data){let e={...draft(x.kind),...x,id:uid(),created_at:now(),updated_at:now()};delete e.user_id;if(await persist(e))count++}render();toast('Импортировано записей: '+count)}
document.addEventListener('click',async ev=>{let b=ev.target.closest('[data-action]');if(!b||busy)return;let a=b.dataset.action;busy=true;try{if(a==='nav')nav(b.dataset.page);if(a==='new')create(b.dataset.kind);if(a==='createcase')await submitNewCase();if(a==='cancelnew'){newCaseKind=null;render()}if(a==='open'){newCaseKind=null;active=b.dataset.id;render()}if(a==='back')nav(b.dataset.kind);if(a==='save')await saveDetail(b.dataset.id);if(a==='delete')await deleteItem(b.dataset.id);if(a==='copy')await copyCase(b.dataset.id);if(a==='loadholdings')document.getElementById('holdings-file')?.click();if(a==='calcportfolio')calculatePortfolio();if(a==='saveportfolio')await savePortfolio();if(a==='chat')openChat(b.dataset.id);if(a==='login'||a==='signup')await authenticate(a);if(a==='forgot')await forgotPassword();if(a==='updatepassword')await updatePassword();if(a==='refresh')await refresh();if(a==='logout')await signout();if(a==='export')exportData();if(a==='import')document.getElementById('importfile').click()}finally{busy=false}});

(async()=>{if(cfg.url&&cfg.key&&!window.supabase?.createClient)toast('Не загрузилась библиотека входа. Проверь интернет и обнови страницу.');if(cfg.url&&cfg.key&&window.supabase?.createClient){try{cloud=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true}});cloud.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){passwordRecovery=true;page='settings';render()}});const r=await cloud.auth.getSession();session=r.data.session;if(session)await refresh()}catch(e){toast('Ошибка подключения к облаку: '+e.message)}}render()})();
