name: Advisor AI DOCX File Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ai-chat.html'
      - 'scripts/test-docx-export.mjs'
      - '.github/workflows/docx-export.yml'

permissions:
  contents: read

jobs:
  verify-docx:
    name: Generate and validate real Word document
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned DOCX generator
        run: npm install --no-save --ignore-scripts --no-package-lock docx@9.5.1
      - name: Build and inspect real DOCX
        run: node scripts/test-docx-export.mjs
