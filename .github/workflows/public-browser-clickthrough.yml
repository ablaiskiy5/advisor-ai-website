name: Advisor AI Public Browser Clickthrough
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/test-live-public-browser.mjs'
      - '.github/workflows/public-browser-clickthrough.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/test-live-public-browser.mjs'
      - '.github/workflows/public-browser-clickthrough.yml'
permissions:
  contents: read
jobs:
  public-buttons:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Click real public UI controls with synthetic values and no account
        run: node scripts/test-live-public-browser.mjs
